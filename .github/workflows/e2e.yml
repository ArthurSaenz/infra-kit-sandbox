# Real-process e2e for `infra-kit dev` against infra-kit's main. The sandbox consumes infra-kit through
# `link:../infra-kit/apps/infra-kit/*`, so both repos are checked out side by side and infra-kit is built from
# source; the weekly run catches infra-kit (or turbo/vite) drifting while this repo sits still.
name: e2e
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions: {}
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    # arm64: infra-kit's pnpm-workspace.yaml `supportedArchitectures` installs its optional binaries (esbuild,
    # turbo) for arm64 only, so an x64 runner cannot build it.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout infra-kit-sandbox
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: infra-kit-sandbox
          persist-credentials: false
      - name: Checkout infra-kit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ArthurSaenz/infra-kit
          path: infra-kit
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: infra-kit-sandbox/package.json
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: infra-kit/.node-version
          package-manager-cache: false
      - name: Install infra-kit dependencies
        working-directory: infra-kit
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build infra-kit
        working-directory: infra-kit
        # All three linked packages, not just the CLI: the sandbox's vite.config.ts loads the vite plugin, and
        # the plugin loads config, straight from their dist/.
        run: pnpm exec turbo run build --filter=infra-kit --filter=@slip-stream-kit/config --filter=@slip-stream-kit/vite
      - name: Install sandbox dependencies
        working-directory: infra-kit-sandbox
        run: pnpm install --frozen-lockfile
      # `infra-kit dev` refuses to start without a portless daemon on :443, and binding :443 needs root. The
      # hosted runner has passwordless sudo and systemd, so the one-time install `infra-kit doctor` prints for
      # a developer (`sudo <node> <portless cli.js> service install`) works here as-is. Absolute node path:
      # sudo's secure_path does not include setup-node's toolcache.
      - name: Install the portless daemon
        working-directory: infra-kit/apps/infra-kit/cli
        run: |
          sudo "$(command -v node)" "$(realpath node_modules/portless/dist/cli.js)" service install
          for _ in $(seq 1 30); do
            if curl -sk -o /dev/null -D - https://127.0.0.1/ | grep -qi '^x-portless: 1'; then exit 0; fi
            sleep 1
          done
          echo "portless never answered on :443" >&2
          sudo systemctl status portless --no-pager || true
          exit 1
      - name: Ensure lsof
        # The harness reads vite's listening port with lsof.
        run: command -v lsof || sudo apt-get install -y --no-install-recommends lsof
      - name: Run the e2e suite
        working-directory: infra-kit-sandbox
        run: pnpm run e2e
